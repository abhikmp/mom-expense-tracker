name: Bug report
description: Something isn't working
type: "Bug"
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Urgent
        - High
        - Medium
        - Low
      default: 1
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Briefly describe what went wrong or what Mom noticed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: App version (from Manage & Settings)
      placeholder: e.g. 1.0.0
    validations:
      required: false
