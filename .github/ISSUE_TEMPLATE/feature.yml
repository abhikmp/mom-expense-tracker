name: Feature request
description: New capability or enhancement
type: "Feature"
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Urgent
        - High
        - Medium
        - Low
      default: 2
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What do you want to add and why?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Behavior / Notes
    validations:
      required: false
