<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mom's Expense Tracker — PIN Lock Interactive Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       APPROVED DESIGN TOKENS — Soft Cards (Light Default + High-Contrast Dark)
       ========================================================================== */
    :root,
    [data-theme="light"] {
      --outer-backdrop: #E2E8F0;
      --color-background: #F8FAFC;
      --color-card: #FFFFFF;
      --color-muted: #EEF2F6;
      --color-foreground: #020617;
      --color-label: #334155;
      --color-muted-foreground: #475569;
      --color-primary: #0F172A;
      --color-on-primary: #FFFFFF;
      --color-primary-hover: #1E293B;
      --color-secondary: #1E3A8A;
      --color-secondary-soft: #DBEAFE;
      --color-secondary-ink: #1E3A8A;
      --color-bar-rest: #64748B;
      --color-border: #E2E8F0;
      --color-rule: #F1F5F9;
      --color-control: #CBD5E1;

      --color-positive: #166534;
      --color-positive-bg: #DCFCE7;
      --color-positive-ink: #14532D;

      --color-warning-bg: #FFFBEB;
      --color-warning-border: #FDE68A;
      --color-warning-ink: #78350F;

      --color-destructive: #DC2626;
      --color-destructive-bg: #FEE2E2;
      --color-destructive-ink: #991B1B;
      --color-destructive-border: #FCA5A5;

      --nav-pill-bg: #DBEAFE;
      --nav-pill-ink: #1E3A8A;
      --backdrop-scrim: rgba(2, 6, 23, 0.5);

      --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

      --radius-card: 20px;
      --radius-control: 14px;
      --radius-chip: 999px;
      --space-gap: 16px;
      --card-pad: 18px;
      --row-pad-y: 14px;
    }

    [data-theme="dark"] {
      --outer-backdrop: #05080F;
      --color-background: #0B0F17;
      --color-card: #131A26;
      --color-muted: #1C2536;
      --color-foreground: #F8FAFC;
      --color-label: #E2E8F0;
      --color-muted-foreground: #B6C2D2;
      --color-primary: #F8FAFC;
      --color-on-primary: #0F172A;
      --color-primary-hover: #E2E8F0;
      --color-secondary: #5B9BF8;
      --color-secondary-soft: #172554;
      --color-secondary-ink: #BFDBFE;
      --color-bar-rest: #64748B;
      --color-border: #232D3F;
      --color-rule: #1B2332;
      --color-control: #334155;

      --color-positive: #4ADE80;
      --color-positive-bg: #143322;
      --color-positive-ink: #86EFAC;

      --color-warning-bg: #261D0B;
      --color-warning-border: #6B4C11;
      --color-warning-ink: #FDE68A;

      --color-destructive: #DC2626;
      --color-destructive-bg: #3B1518;
      --color-destructive-ink: #FCA5A5;
      --color-destructive-border: #7F1D1D;

      --nav-pill-bg: #172554;
      --nav-pill-ink: #93C5FD;
      --backdrop-scrim: rgba(0, 0, 0, 0.72);
      color-scheme: dark;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-family: var(--font-sans);
      background: var(--outer-backdrop);
      color: var(--color-foreground);
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--outer-backdrop);
      color: var(--color-foreground);
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    input::placeholder, textarea::placeholder { color: var(--color-muted-foreground); opacity: 0.8; }
    button { touch-action: manipulation; }

    .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* ==========================================================================
       PROTOTYPE SIMULATION BAR (Outside Phone Frame)
       ========================================================================== */
    .proto-shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 0;
    }

    .proto-bar {
      width: 100%;
      max-width: 430px;
      background: var(--color-card);
      border-bottom: 1px solid var(--color-border);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }

    @media (min-width: 480px) {
      .proto-shell { padding: 16px; }
      .proto-bar {
        border: 1px solid var(--color-border);
        border-radius: 18px;
      }
    }

    .proto-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .proto-title {
      font-weight: 700;
      font-size: 13px;
      color: var(--color-foreground);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .proto-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .proto-btn {
      min-height: 36px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid var(--color-control);
      background: var(--color-background);
      color: var(--color-foreground);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background-color 140ms var(--ease-out), transform 140ms var(--ease-out);
    }

    .proto-btn:active { transform: scale(0.97); }
    .proto-btn:focus-visible { outline: 2px solid var(--color-secondary); outline-offset: 2px; }
    @media (hover: hover) and (pointer: fine) {
      .proto-btn:hover { background: var(--color-muted); }
    }

    .proto-creds {
      font-size: 12px;
      color: var(--color-muted-foreground);
      line-height: 1.35;
    }

    .proto-creds code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--color-muted);
      color: var(--color-foreground);
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 12px;
    }

    /* ==========================================================================
       PHONE-ONLY ANDROID APP SHELL
       ========================================================================== */
    .phone-frame {
      width: 100%;
      max-width: 430px;
      min-height: calc(100dvh - 108px);
      background: var(--color-background);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (min-width: 480px) {
      .phone-frame {
        min-height: 760px;
        border: 1px solid var(--color-border);
        border-radius: 28px;
        overflow: clip;
      }
    }

    .android-topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--color-card);
      border-bottom: 1px solid var(--color-border);
      padding: calc(6px + env(safe-area-inset-top)) 16px 6px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .topbar-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .topbar-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--color-foreground);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-actions { display: flex; align-items: center; gap: 6px; flex: none; }

    .phone-scroll {
      flex: 1;
      padding: 16px 16px calc(92px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: var(--space-gap);
    }

    /* ==========================================================================
       BUTTONS & TOUCH TARGETS (>= 48dp / >= 44pt)
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 16px;
      border-radius: var(--radius-control);
      border: 1px solid transparent;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 140ms var(--ease-out), border-color 140ms var(--ease-out), transform 140ms var(--ease-out);
    }

    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn:not(:disabled):active, .icon-btn:active, .chip-btn:active, .tx-row-btn:active, .account-row-btn:active, .android-nav-btn:active, .seg-btn:active {
      transform: scale(0.97);
    }
    .btn:focus-visible, .icon-btn:focus-visible, .chip-btn:focus-visible, .tx-row-btn:focus-visible, .account-row-btn:focus-visible, .android-nav-btn:focus-visible, .seg-btn:focus-visible, .link-btn:focus-visible {
      outline: 2px solid var(--color-secondary);
      outline-offset: 2px;
    }

    .btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
    .btn-secondary { background: var(--color-card); color: var(--color-foreground); border-color: var(--color-control); }
    .btn-ghost { background: transparent; color: var(--color-foreground); padding: 0 10px; }
    .btn-danger-outline { background: var(--color-card); color: var(--color-destructive-ink); border-color: var(--color-destructive-border); }
    .btn-danger-fill { background: var(--color-destructive); color: #FFFFFF; }
    .btn-sm { min-height: 44px; padding: 0 12px; font-size: 14px; }
    .btn-block { width: 100%; }

    .link-btn {
      min-height: 44px;
      padding: 0 8px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--color-secondary-ink);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      min-height: 48px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--color-foreground);
      cursor: pointer;
      flex: none;
      transition: background-color 140ms var(--ease-out), transform 140ms var(--ease-out);
    }

    .icon-btn-outlined { border-color: var(--color-control); background: var(--color-card); border-radius: var(--radius-control); }

    @media (hover: hover) and (pointer: fine) {
      .btn-primary:not(:disabled):hover { background: var(--color-primary-hover); }
      .btn-secondary:not(:disabled):hover, .icon-btn:hover, .btn-ghost:hover, .link-btn:hover { background: var(--color-muted); }
      .tx-row-btn:hover, .account-row-btn:hover { background: var(--color-muted); }
    }

    /* ==========================================================================
       CARDS, LOCKED STATES & BANNERS
       ========================================================================== */
    .card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: var(--card-pad);
    }
    .card-flush { padding: 0; overflow: hidden; }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .card-header-padded { padding: var(--card-pad) var(--card-pad) 12px; margin-bottom: 0; border-bottom: 1px solid var(--color-rule); }
    .section-title { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--color-foreground); }
    .sub-caption { margin: 2px 0 0; font-size: 13px; font-weight: 500; color: var(--color-muted-foreground); line-height: 1.35; }
    .app-version { margin: 4px 0 0; text-align: center; font-size: 12px; font-weight: 500; color: var(--color-muted-foreground); }

    .lock-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 28px 20px;
      gap: 12px;
    }

    .lock-badge {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: var(--color-secondary-soft);
      color: var(--color-secondary-ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .lock-card-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--color-foreground);
      line-height: 1.3;
    }

    .lock-card-copy {
      margin: 0;
      font-size: 14px;
      color: var(--color-muted-foreground);
      max-width: 28ch;
      line-height: 1.45;
    }

    .lock-card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      margin-top: 4px;
    }

    .banner { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--radius-card); border: 1px solid var(--color-border); animation: bannerEnter 180ms var(--ease-out); }
    .banner-warning { background: var(--color-warning-bg); border-color: var(--color-warning-border); color: var(--color-warning-ink); }
    .banner-success { background: var(--color-positive-bg); border-color: var(--color-positive-bg); color: var(--color-positive-ink); }
    .banner-error { background: var(--color-destructive-bg); border-color: var(--color-destructive-border); color: var(--color-destructive-ink); }
    .banner-copy { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; font-weight: 500; line-height: 1.4; }
    .banner-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    @keyframes bannerEnter { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    .balance-label { font-size: 14px; font-weight: 500; color: var(--color-muted-foreground); }
    .balance-hero { margin: 4px 0 0; font-size: 32px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; color: var(--color-foreground); }

    .account-rows { display: flex; flex-direction: column; }
    .account-row-btn {
      width: 100%;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: var(--row-pad-y) var(--card-pad);
      border: 0;
      border-bottom: 1px solid var(--color-rule);
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background-color 140ms var(--ease-out), transform 140ms var(--ease-out);
    }
    .account-row-btn:last-child { border-bottom: 0; }
    .account-name { font-size: 16px; font-weight: 600; color: var(--color-foreground); }
    .account-sub { font-size: 13px; font-weight: 500; color: var(--color-muted-foreground); }
    .account-right { display: flex; align-items: center; gap: 8px; flex: none; }
    .account-amount { font-size: 17px; font-weight: 700; color: var(--color-foreground); white-space: nowrap; }
    .row-chevron { color: var(--color-muted-foreground); display: inline-flex; align-items: center; }

    /* Spending & Transaction Rows */
    .spend-header { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .spend-header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .month-switcher { display: inline-flex; align-items: center; gap: 4px; }
    .month-label { min-width: 112px; text-align: center; font-size: 14px; font-weight: 600; color: var(--color-foreground); }
    .spend-list { display: flex; flex-direction: column; gap: 14px; }
    .spend-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .spend-cat { font-size: 15px; font-weight: 600; color: var(--color-foreground); display: flex; align-items: center; gap: 8px; }
    .spend-pct { font-size: 13px; font-weight: 500; color: var(--color-muted-foreground); }
    .spend-val { font-size: 16px; font-weight: 700; color: var(--color-foreground); white-space: nowrap; }
    .spend-track { height: 8px; width: 100%; border-radius: 999px; background: var(--color-muted); overflow: hidden; }
    .spend-fill { height: 100%; border-radius: 999px; background: var(--color-bar-rest); transition: width 220ms var(--ease-out); }
    .spend-fill-lead { background: var(--color-secondary); }

    .tx-list { display: flex; flex-direction: column; }
    .tx-row-btn {
      width: 100%;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: var(--row-pad-y) var(--card-pad);
      border: 0;
      border-bottom: 1px solid var(--color-rule);
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background-color 140ms var(--ease-out), transform 140ms var(--ease-out);
    }
    .tx-row-btn:last-child { border-bottom: 0; }
    .tx-left { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .tx-primary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 16px; font-weight: 600; color: var(--color-foreground); }
    .tx-meta { font-size: 13px; font-weight: 500; color: var(--color-muted-foreground); line-height: 1.35; }
    .tx-right { flex: none; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .tx-amount { font-size: 17px; font-weight: 700; color: var(--color-foreground); white-space: nowrap; }
    .tx-amount-positive { color: var(--color-positive); }
    .tx-date { font-size: 13px; font-weight: 500; color: var(--color-muted-foreground); white-space: nowrap; }

    .pill { display: inline-flex; align-items: center; min-height: 22px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; flex: none; }
    .pill-neutral { background: var(--color-muted); color: var(--color-label); }
    .pill-positive { background: var(--color-positive-bg); color: var(--color-positive-ink); }
    .pill-secondary { background: var(--color-secondary-soft); color: var(--color-secondary-ink); }

    /* ==========================================================================
       FORMS, SEGMENTED TOGGLES, CHIPS & PASSWORDS
       ========================================================================== */
    .form-stack { display: flex; flex-direction: column; gap: 16px; }
    .field-label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--color-label); }
    .field-hint { margin: 6px 0 0; font-size: 13px; color: var(--color-muted-foreground); line-height: 1.4; }
    .field-error { margin: 6px 0 0; font-size: 14px; font-weight: 600; color: var(--color-destructive-ink); }

    .segmented-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: var(--color-muted); border: 1px solid var(--color-border); }
    .seg-btn { min-height: 44px; border: 1px solid transparent; border-radius: 999px; background: transparent; color: var(--color-label); font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out), transform 140ms var(--ease-out); }
    .seg-btn[aria-pressed="true"] { background: var(--color-card); color: var(--color-foreground); border-color: var(--color-control); }
    .segmented-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

    .amount-box { display: flex; align-items: center; gap: 8px; padding: 8px 14px; min-height: 62px; border: 1.5px solid var(--color-control); border-radius: var(--radius-control); background: var(--color-card); }
    .amount-box:focus-within { border-color: var(--color-secondary); outline: 2px solid var(--color-secondary-soft); }
    .amount-currency { font-size: 26px; font-weight: 700; color: var(--color-muted-foreground); }
    .amount-input { width: 100%; border: 0; outline: none; background: transparent; font-size: 28px; font-weight: 700; color: var(--color-foreground); }

    .text-input, .select-input { width: 100%; min-height: 48px; padding: 0 12px; border: 1px solid var(--color-control); border-radius: var(--radius-control); background: var(--color-card); color: var(--color-foreground); font-size: 16px; }
    .text-input:focus, .select-input:focus { outline: 2px solid var(--color-secondary); outline-offset: 1px; }
    .text-input:disabled { opacity: 0.6; cursor: not-allowed; background: var(--color-muted); }

    .pin-input {
      letter-spacing: 0.25em;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
    }

    .input-with-toggle {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-with-toggle .text-input {
      padding-right: 52px;
    }
    .input-eye-btn {
      position: absolute;
      right: 2px;
      min-width: 44px;
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--color-muted-foreground);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .input-eye-btn:focus-visible { outline: 2px solid var(--color-secondary); outline-offset: 1px; }
    @media (hover: hover) and (pointer: fine) {
      .input-eye-btn:hover { color: var(--color-foreground); background: var(--color-muted); }
    }

    .chip-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip-btn { min-height: 48px; padding: 0 16px; border-radius: var(--radius-chip); border: 1px solid var(--color-control); background: var(--color-card); color: var(--color-foreground); font-size: 15px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background-color 140ms var(--ease-out), border-color 140ms var(--ease-out), transform 140ms var(--ease-out); }
    .chip-btn[aria-pressed="true"] { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); font-weight: 600; }
    .chip-add-btn { border-style: dashed; color: var(--color-secondary-ink); border-color: var(--color-secondary); background: transparent; }

    .filter-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .manage-item { display: flex; flex-direction: column; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--color-rule); }
    .manage-item:last-child { border-bottom: 0; padding-bottom: 0; }

    /* ==========================================================================
